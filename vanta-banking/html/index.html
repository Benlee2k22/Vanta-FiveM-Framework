<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanta Bank</title><link rel="stylesheet" href="style.css"></head>
<body><main id="bank" class="shell hidden"><section class="card">
  <header><div class="brand"><span class="mark">V</span><div><small>VANTA FINANCIAL</small><h1>Banking</h1></div></div><button id="close" aria-label="Close">×</button></header>
  <div class="balance"><div><small id="accountLabel">PERSONAL ACCOUNT</small><p>Available balance</p><strong id="balance">$0</strong></div><span class="chip">● ● ● ● &nbsp; 2048</span></div>
  <nav class="actions"><button data-action="deposit"><i>↓</i><span>Deposit</span></button><button data-action="withdraw"><i>↑</i><span>Withdraw</span></button><button id="transferAction" data-action="transfer"><i>⇄</i><span>Transfer</span></button></nav>
  <section id="form" class="form hidden"><div class="form-heading"><h2 id="formTitle">Deposit</h2><button id="cancel">Cancel</button></div><label id="recipientWrap" class="hidden">Recipient citizen ID<input id="recipient" maxlength="50" autocomplete="off" placeholder="e.g. V1720000000"></label><label>Amount<input id="amount" type="number" min="1" step="1" placeholder="0"></label><button id="submit" class="primary">Confirm transaction</button></section>
  <section class="activity"><div class="activity-head"><h2>Recent activity</h2><span>Last 15</span></div><div id="transactions" class="transactions"><p class="empty">No recent transactions</p></div></section>
  <footer><span>Vanta Bank</span><span>SECURE SESSION <b>●</b></span></footer>
</section></main><script src="app.js"></script></body></html>
