<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanta Roleplay</title><link rel="stylesheet" href="style.css"></head><body>
<div class="backdrop"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="grid"></div></div>
<main class="layout">
<header><div class="brand"><span class="mark">V</span><span><small>WELCOME TO</small><strong>VANTA ROLEPLAY</strong></span></div><span class="online"><i></i> CONNECTING TO SERVER</span></header>
<section class="hero"><small class="eyebrow">A CITY OF YOUR OWN</small><h1>Your next story<br><em>starts here.</em></h1><p>Take your time. Los Santos is waiting.</p></section>
<section class="load-card"><div class="load-top"><span id="status">Preparing your connection</span><strong id="percent">0%</strong></div><div class="track"><i id="fill"></i></div><div class="load-bottom"><span>VANTA FRAMEWORK <b>•</b> EARLY ACCESS</span><span id="tip">Tip: Use E at nearby locations to open their options.</span></div></section>
<footer><button id="music"><span class="music-icon">♫</span><span><b id="musicLabel">Enable ambient music</b><small>Optional background soundtrack</small></span><i id="musicToggle">OFF</i></button><label class="volume"><span>VOLUME</span><input id="volume" type="range" min="0" max="100" value="28"></label><span class="version">VANTA • LOS SANTOS</span></footer>
</main><script src="app.js"></script></body></html>
