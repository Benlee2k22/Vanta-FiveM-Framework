$engine: 3
$onesync: on

name: Vanta FiveM Framework
version: 0.1.0
author: Vanta
description: Early access Vanta framework with banking, police, hospital, inventory, E interactions, and a QBCore compatibility bridge.

tasks:
  # txAdmin asks for database credentials and creates/selects the database.
  - action: connect_database

  # Import the Cfx default server resources and remove the legacy chat resource.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Download the official oxmysql release.
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.3/oxmysql.zip
    path: ./tmp/oxmysql.zip

  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[standalone]

  # Download Vanta, then place each resource at the path its resource name expects.
  - action: download_github
    src: https://github.com/Benlee2k22/Vanta-FiveM-Framework
    ref: feature/interaction-hud-e-menu
    dest: ./tmp/vanta

  - action: query_database
    file: ./tmp/vanta/sql/vanta.sql

  - action: ensure_dir
    path: ./resources/[vanta]

  - action: move_path
    src: ./tmp/vanta/vanta-loading
    dest: ./resources/[vanta]/vanta-loading

  - action: move_path
    src: ./tmp/vanta/vanta-core
    dest: ./resources/[vanta]/vanta-core

  - action: move_path
    src: ./tmp/vanta/vanta-ui
    dest: ./resources/[vanta]/vanta-ui

  - action: move_path
    src: ./tmp/vanta/vanta-character
    dest: ./resources/[vanta]/vanta-character

  - action: move_path
    src: ./tmp/vanta/vanta-clothing
    dest: ./resources/[vanta]/vanta-clothing

  - action: move_path
    src: ./tmp/vanta/vanta-banking
    dest: ./resources/[vanta]/vanta-banking

  - action: move_path
    src: ./tmp/vanta/vanta-police
    dest: ./resources/[vanta]/vanta-police

  - action: move_path
    src: ./tmp/vanta/vanta-hospital
    dest: ./resources/[vanta]/vanta-hospital

  - action: move_path
    src: ./tmp/vanta/vanta-inventory
    dest: ./resources/[vanta]/vanta-inventory

  # Keep this resource name so scripts using exports['qb-core'] can find the bridge.
  - action: move_path
    src: ./tmp/vanta/qb-core
    dest: ./resources/[vanta]/qb-core

  # Start the default game resources, then the database driver and Vanta modules.
  - action: download_file
    url: https://raw.githubusercontent.com/citizenfx/txAdmin-recipes/main/default-fivem/server.cfg
    path: ./server.cfg

  - action: write_file
    file: ./server.cfg
    append: true
    data: |

      # Vanta Framework
      sv_hostname "{{serverName}} | Vanta Framework"
      sets sv_projectName "Vanta Framework"
      sets sv_projectDesc "Vanta early access roleplay framework"
      set mysql_connection_string "{{dbConnectionString}}"

      ensure oxmysql
      ensure vanta-loading
      ensure vanta-core
      ensure vanta-ui
      ensure vanta-character
      ensure vanta-clothing
      ensure vanta-banking
      ensure vanta-police
      ensure vanta-hospital
      ensure qb-core
      ensure vanta-inventory

      add_ace group.admin vanta.admin allow

      # Add framework-dependent resources below this line.

  - action: remove_path
    path: ./tmp
